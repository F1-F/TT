name: GitHub Japan CF Nodes Top 25

on:
  # 每 3 小时运行一次
  # GitHub Actions 使用 UTC
  schedule:
    - cron: '17 */3 * * *'

  # 支持 Actions 页面手动运行
  workflow_dispatch:

# 防止多个任务同时修改仓库
concurrency:
  group: github-jp-nodes
  cancel-in-progress: true

# 允许 Workflow 写入当前仓库
permissions:
  contents: write

jobs:
  collect-japan-nodes:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. 初始化
      # ==========================================================
      - name: Initialize
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            github-node-source.tmp \
            github-repositories.tmp \
            github-repositories.unique \
            jp-japan-lines.tmp \
            jp-candidates.tmp \
            jp-nodes.txt \
            jp-speed-results.txt \
            github-jp-nodes.new \
            .jp-update

          touch github-node-source.tmp
          touch github-repositories.tmp

          echo "=========================================="
          echo "GitHub Japan CF Node Collector"
          echo "=========================================="

          echo ""
          echo "UTC:"
          date -u

          echo ""
          echo "Search window:"
          date -u -d '12 hours ago'

      # ==========================================================
      # 3. 搜索 GitHub
      # ==========================================================
      - name: Search GitHub candidate files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Bash 原生 URL 编码
          #
          # 不依赖 Python
          # --------------------------------------------------------
          urlencode() {
            local string="${1}"
            local strlen=${#string}
            local encoded=""
            local pos c o

            for ((pos=0; pos<strlen; pos++)); do

              c="${string:$pos:1}"

              case "$c" in
                [-_.~a-zA-Z0-9])
                  o="$c"
                  ;;
                *)
                  printf -v o '%%%02X' "'$c"
                  ;;
              esac

              encoded+="${o}"

            done

            printf '%s' "$encoded"
          }

          # --------------------------------------------------------
          # 搜索关键词
          # --------------------------------------------------------
          QUERIES=(
            '"#JP"'
            '"#Japan"'
            '"🇯🇵"'
            '"JP 🇯🇵"'
            '"443#JP"'
            '"2053#JP"'
            '"8443#JP"'
            '"2083#JP"'
            '"2087#JP"'
            '"2096#JP"'
            '"Japan"'
            '"日本"'
            '"Cloudflare"'
            '"CF"'
          )

          for QUERY in "${QUERIES[@]}"; do

            echo ""
            echo "=========================================="
            echo "Searching: $QUERY"
            echo "=========================================="

            ENCODED_QUERY=$(urlencode "$QUERY")

            for PAGE in 1 2; do

              RESPONSE=$(curl -fsSL \
                --retry 3 \
                --connect-timeout 15 \
                --max-time 60 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/search/code?q=${ENCODED_QUERY}&per_page=100&page=${PAGE}" \
                || true)

              if [ -z "$RESPONSE" ]; then
                echo "Empty API response."
                break
              fi

              # ----------------------------------------------------
              # API 错误
              # ----------------------------------------------------
              if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then

                echo "GitHub API:"
                echo "$RESPONSE" | jq -r '.message'

                break

              fi

              COUNT=$(echo "$RESPONSE" | jq '.items | length')

              echo "Page $PAGE: $COUNT results"

              # ----------------------------------------------------
              # 保存仓库 / 文件 / branch
              # ----------------------------------------------------
              echo "$RESPONSE" |
                jq -r '
                  .items[]?
                  | select(.repository.private == false)
                  | [
                      .repository.full_name,
                      .path,
                      (.repository.default_branch // "main")
                    ]
                  | @tsv
                ' >> github-repositories.tmp

              if [ "$COUNT" -lt 100 ]; then
                break
              fi

              sleep 3

            done

            # 避免 API 请求过快
            sleep 4

          done

          # --------------------------------------------------------
          # 去重
          # --------------------------------------------------------
          sort -u \
            github-repositories.tmp \
            > github-repositories.unique

          echo ""
          echo "=========================================="
          echo "Candidate files"
          echo "=========================================="

          wc -l github-repositories.unique

      # ==========================================================
      # 4. 下载候选文件
      # ==========================================================
      - name: Download candidate files
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Bash 原生 URL 编码
          # --------------------------------------------------------
          urlencode() {
            local string="${1}"
            local strlen=${#string}
            local encoded=""
            local pos c o

            for ((pos=0; pos<strlen; pos++)); do

              c="${string:$pos:1}"

              case "$c" in
                [-_.~a-zA-Z0-9])
                  o="$c"
                  ;;
                *)
                  printf -v o '%%%02X' "'$c"
                  ;;
              esac

              encoded+="${o}"

            done

            printf '%s' "$encoded"
          }

          # --------------------------------------------------------
          # 下载所有候选文件
          # --------------------------------------------------------
          while IFS=$'\t' read -r REPO PATH BRANCH; do

            [ -z "$REPO" ] && continue
            [ -z "$PATH" ] && continue

            ENCODED_PATH=$(urlencode "$PATH")

            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${ENCODED_PATH}"

            echo ""
            echo "Downloading:"
            echo "  Repository: $REPO"
            echo "  File:       $PATH"

            curl -fsSL \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 30 \
              "$RAW_URL" \
              >> github-node-source.tmp \
              || true

            echo "" >> github-node-source.tmp

            sleep 0.4

          done < github-repositories.unique

          echo ""
          echo "Downloaded source:"
          wc -c github-node-source.tmp

      # ==========================================================
      # 5. 提取日本 IPv4
      # ==========================================================
      - name: Extract Japan IPv4 nodes
        shell: bash
        run: |
          set -euo pipefail

          : > jp-japan-lines.tmp
          : > jp-candidates.tmp
          : > jp-nodes.txt

          if [ ! -s github-node-source.tmp ]; then

            echo "No downloaded source data."

            exit 0

          fi

          # --------------------------------------------------------
          # 查找明确的日本标识
          #
          # #JP
          # #Japan
          # 🇯🇵
          # 日本
          # --------------------------------------------------------
          grep -Ei \
            '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}.*(#JP|#Japan|🇯🇵|日本)' \
            github-node-source.tmp \
            > jp-japan-lines.tmp \
            || true

          # --------------------------------------------------------
          # 提取 IPv4:PORT
          # --------------------------------------------------------
          if [ -s jp-japan-lines.tmp ]; then

            grep -oE \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}' \
              jp-japan-lines.tmp \
              > jp-candidates.tmp \
              || true

          fi

          # --------------------------------------------------------
          # 验证
          # --------------------------------------------------------
          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            IP="${NODE%:*}"
            PORT="${NODE##*:}"

            # IPv4
            [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || continue

            # Port
            [[ "$PORT" =~ ^[0-9]+$ ]] \
              || continue

            IFS='.' read -r A B C D <<< "$IP"

            # IP 范围
            if [ "$A" -gt 255 ] ||
               [ "$B" -gt 255 ] ||
               [ "$C" -gt 255 ] ||
               [ "$D" -gt 255 ]; then

              continue

            fi

            # Port 范围
            if [ "$PORT" -lt 1 ] ||
               [ "$PORT" -gt 65535 ]; then

              continue

            fi

            echo "${IP}:${PORT}#JP"

          done < jp-candidates.tmp |
          sort -u \
            > jp-nodes.txt

          echo ""
          echo "=========================================="
          echo "Unique Japan nodes"
          echo "=========================================="

          wc -l jp-nodes.txt

      # ==========================================================
      # 6. TCP + HTTPS 测试
      # ==========================================================
      - name: Test Japan nodes
        shell: bash
        run: |
          set -u

          INPUT="jp-nodes.txt"
          RESULTS="jp-speed-results.txt"

          : > "$RESULTS"

          if [ ! -s "$INPUT" ]; then

            echo "No Japan nodes found."
            exit 0

          fi

          TOTAL=$(wc -l < "$INPUT")
          COUNT=0

          echo "=========================================="
          echo "Testing Japan nodes"
          echo "Total: $TOTAL"
          echo "=========================================="

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            COUNT=$((COUNT + 1))

            HOST="${NODE%%:*}"

            PORT="${NODE#*:}"
            PORT="${PORT%%#*}"

            echo ""
            echo "[$COUNT/$TOTAL] ${HOST}:${PORT}"

            # ------------------------------------------------------
            # TCP
            # ------------------------------------------------------

            TCP_START=$(date +%s%3N)

            if timeout 4 \
              bash -c ":</dev/tcp/$HOST/$PORT" \
              >/dev/null 2>&1; then

              TCP_END=$(date +%s%3N)

              TCP_MS=$((TCP_END - TCP_START))

              echo "TCP: ${TCP_MS} ms"

            else

              echo "TCP: FAILED"

              continue

            fi

            # ------------------------------------------------------
            # HTTPS / TLS
            # ------------------------------------------------------

            CURL_OUTPUT=$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}' \
                --connect-timeout 4 \
                --max-time 7 \
                --resolve "www.cloudflare.com:443:${HOST}" \
                "https://www.cloudflare.com/cdn-cgi/trace" \
                2>/dev/null
            ) || true

            if [ -z "$CURL_OUTPUT" ]; then

              echo "HTTPS: FAILED"

              continue

            fi

            HTTP_CODE=$(echo "$CURL_OUTPUT" | awk '{print $1}')
            TIME_CONNECT=$(echo "$CURL_OUTPUT" | awk '{print $2}')
            TIME_TTFB=$(echo "$CURL_OUTPUT" | awk '{print $3}')
            TIME_TOTAL=$(echo "$CURL_OUTPUT" | awk '{print $4}')

            # ------------------------------------------------------
            # 2xx / 3xx
            # ------------------------------------------------------

            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then

              CONNECT_MS=$(awk \
                -v t="$TIME_CONNECT" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TTFB_MS=$(awk \
                -v t="$TIME_TTFB" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TOTAL_MS=$(awk \
                -v t="$TIME_TOTAL" \
                'BEGIN { printf "%.0f", t * 1000 }')

              echo "HTTP:    $HTTP_CODE"
              echo "Connect: ${CONNECT_MS} ms"
              echo "TTFB:    ${TTFB_MS} ms"
              echo "Total:   ${TOTAL_MS} ms"

              printf '%s %s %s %s\n' \
                "$TOTAL_MS" \
                "$TCP_MS" \
                "$TTFB_MS" \
                "$NODE" \
                >> "$RESULTS"

            else

              echo "HTTPS HTTP CODE: $HTTP_CODE"

            fi

          done < "$INPUT"

          echo ""
          echo "=========================================="
          echo "Working Japan nodes"
          echo "=========================================="

          wc -l "$RESULTS"

      # ==========================================================
      # 7. Top 25
      # ==========================================================
      - name: Select Top 25 Japan nodes
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="github-jp-nodes.txt"

          # --------------------------------------------------------
          # 本轮没有任何有效节点
          #
          # 保留旧文件
          # --------------------------------------------------------
          if [ ! -s jp-speed-results.txt ]; then

            echo "No working Japan nodes."
            echo "Keeping previous TXT."

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 排序：
          #
          # 1 HTTPS 总耗时
          # 2 TCP
          # 3 TTFB
          # --------------------------------------------------------

          sort -n \
            -k1,1 \
            -k2,2 \
            -k3,3 \
            jp-speed-results.txt |
          head -n 25 |
          awk '{print $4}' \
            > github-jp-nodes.new

          # --------------------------------------------------------
          # 防止空文件
          # --------------------------------------------------------

          if [ ! -s github-jp-nodes.new ]; then

            echo "Generated file is empty."

            rm -f github-jp-nodes.new

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 原子替换
          # --------------------------------------------------------

          mv github-jp-nodes.new "$OUTPUT"

          echo "true" > .jp-update

          echo ""
          echo "=========================================="
          echo "TOP 25 JAPAN NODES"
          echo "=========================================="

          cat "$OUTPUT"

          echo ""
          echo "Total:"
          wc -l < "$OUTPUT"

      # ==========================================================
      # 8. Git Commit
      # ==========================================================
      - name: Commit updated TXT
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # 没有更新
          # --------------------------------------------------------

          if [ ! -f .jp-update ]; then

            echo "No update status."
            exit 0

          fi

          if [ "$(cat .jp-update)" != "true" ]; then

            echo "No new result."
            echo "Keeping previous TXT."

            exit 0

          fi

          # --------------------------------------------------------
          # 文件必须存在
          # --------------------------------------------------------

          if [ ! -f github-jp-nodes.txt ]; then

            echo "github-jp-nodes.txt does not exist."
            echo "Skipping commit."

            exit 0

          fi

          # --------------------------------------------------------
          # 文件不能是空的
          # --------------------------------------------------------

          if [ ! -s github-jp-nodes.txt ]; then

            echo "github-jp-nodes.txt is empty."
            echo "Skipping commit."

            exit 0

          fi

          # --------------------------------------------------------
          # Git
          # --------------------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- github-jp-nodes.txt

          # --------------------------------------------------------
          # 没变化
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          # --------------------------------------------------------
          # Commit
          # --------------------------------------------------------

          git commit \
            -m "Update Japan CF top 25 nodes"

          # --------------------------------------------------------
          # Push
          # --------------------------------------------------------

          git push

      # ==========================================================
      # 9. 输出报告
      # ==========================================================
      - name: Show final report
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Japan CF Speed Report"
          echo "=========================================="

          if [ -s jp-speed-results.txt ]; then

            echo ""
            echo "HTTPS(ms) TCP(ms) TTFB(ms) NODE"
            echo "------------------------------------------"

            sort -n \
              -k1,1 \
              -k2,2 \
              -k3,3 \
              jp-speed-results.txt |
            head -n 25

          else

            echo "No working nodes."

          fi

          echo ""
          echo "=========================================="
          echo "Final TXT"
          echo "=========================================="

          if [ -s github-jp-nodes.txt ]; then

            cat github-jp-nodes.txt

          else

            echo "No new TXT generated."

          fi
