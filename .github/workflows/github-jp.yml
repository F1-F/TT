name: GitHub Japan CF Nodes Top 25

on:
  schedule:
    # 每 3 小时运行一次
    - cron: '17 */3 * * *'

  workflow_dispatch:

# 防止多个实例同时修改仓库
concurrency:
  group: github-jp-nodes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect-japan-nodes:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. 安装并检查依赖
      # ==========================================================
      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking runner environment"
          echo "=========================================="

          echo "OS:"
          cat /etc/os-release || true

          echo ""
          echo "PATH:"
          echo "$PATH"

          echo ""
          echo "Installing required packages..."

          sudo apt-get update -y

          sudo apt-get install -y \
            curl \
            jq \
            coreutils \
            grep \
            gawk \
            sed

          echo ""
          echo "=========================================="
          echo "Dependency check"
          echo "=========================================="

          command -v bash
          command -v curl
          command -v jq
          command -v grep
          command -v awk
          command -v sort
          command -v timeout
          command -v sleep

          echo ""
          echo "curl:"
          curl --version | head -n 1

          echo ""
          echo "jq:"
          jq --version

          echo ""
          echo "All dependencies OK."

      # ==========================================================
      # 3. 初始化
      # ==========================================================
      - name: Initialize
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            github-node-source.tmp \
            github-repositories.tmp \
            github-repositories.unique \
            jp-japan-lines.tmp \
            jp-candidates.tmp \
            jp-nodes.txt \
            jp-speed-results.txt \
            github-jp-nodes.new \
            .jp-update \
            .api-stop

          touch github-node-source.tmp
          touch github-repositories.tmp

          echo "=========================================="
          echo "Japan CF Node Collector"
          echo "=========================================="

          echo ""
          echo "Current UTC:"
          date -u

          echo ""
          echo "12-hour window starts:"
          date -u -d '12 hours ago'

      # ==========================================================
      # 4. 搜索 GitHub
      #
      # 降低 API 请求量：
      # 每个关键词只查询第一页
      # 避免大量 Code Search 请求触发 secondary rate limit
      # ==========================================================
      - name: Search GitHub candidate files
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -u

          # --------------------------------------------------------
          # Bash URL Encode
          # 不依赖 Python
          # --------------------------------------------------------
          urlencode() {

            local string="${1}"
            local strlen=${#string}
            local encoded=""
            local pos
            local c
            local o

            for ((pos=0; pos<strlen; pos++)); do

              c="${string:$pos:1}"

              case "$c" in

                [-_.~a-zA-Z0-9])
                  o="$c"
                  ;;

                *)
                  printf -v o '%%%02X' "'$c"
                  ;;

              esac

              encoded+="${o}"

            done

            printf '%s' "$encoded"
          }

          # --------------------------------------------------------
          # 只使用少量高价值关键词
          # --------------------------------------------------------
          QUERIES=(
            '"#JP"'
            '"#Japan"'
            '"🇯🇵"'
            '"日本"'
            '"443#JP"'
            '"2053#JP"'
            '"8443#JP"'
          )

          for QUERY in "${QUERIES[@]}"; do

            # 如果之前已经收到 API 限流
            if [ -f .api-stop ]; then
              echo "API stop flag detected."
              break
            fi

            echo ""
            echo "=========================================="
            echo "GitHub Search: $QUERY"
            echo "=========================================="

            ENCODED_QUERY=$(urlencode "$QUERY")

            API_URL="https://api.github.com/search/code?q=${ENCODED_QUERY}&per_page=100&page=1"

            # ------------------------------------------------------
            # 请求
            # ------------------------------------------------------
            RESPONSE=$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 15 \
                --max-time 60 \
                --retry 2 \
                --retry-delay 5 \
                --retry-max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API_URL" \
                2>&1
            )

            CURL_STATUS=$?

            if [ "$CURL_STATUS" -ne 0 ]; then

              echo "GitHub API curl failed."
              echo "curl exit code: $CURL_STATUS"

              sleep 10

              continue

            fi

            # ------------------------------------------------------
            # 检查 API 是否返回错误
            # ------------------------------------------------------
            if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then

              MESSAGE=$(echo "$RESPONSE" |
                jq -r '.message // "Unknown API error"')

              echo "GitHub API error:"
              echo "$MESSAGE"

              # ----------------------------------------------------
              # 403 / rate limit
              # ----------------------------------------------------
              if echo "$RESPONSE" |
                grep -qiE 'rate limit|secondary rate|403|forbidden'; then

                echo ""
                echo "GitHub API rate limit detected."
                echo "Stopping further API searches."

                touch .api-stop

                break

              fi

              sleep 10

              continue

            fi

            # ------------------------------------------------------
            # 提取搜索结果
            # ------------------------------------------------------
            COUNT=$(echo "$RESPONSE" |
              jq '.items | length' 2>/dev/null || echo 0)

            echo "Results: $COUNT"

            if [ "$COUNT" -gt 0 ]; then

              echo "$RESPONSE" |
                jq -r '
                  .items[]?
                  | select(.repository.private == false)
                  | [
                      .repository.full_name,
                      .path,
                      (.repository.default_branch // "main")
                    ]
                  | @tsv
                ' >> github-repositories.tmp

            fi

            # ------------------------------------------------------
            # 限速
            # ------------------------------------------------------
            sleep 8

          done

          # --------------------------------------------------------
          # 去重
          # --------------------------------------------------------
          sort -u \
            github-repositories.tmp \
            > github-repositories.unique

          echo ""
          echo "=========================================="
          echo "Candidate files"
          echo "=========================================="

          wc -l github-repositories.unique

          if [ -f .api-stop ]; then

            echo ""
            echo "WARNING:"
            echo "GitHub API rate limit was reached."

          fi

      # ==========================================================
      # 5. 下载候选文件
      # ==========================================================
      - name: Download candidate files
        shell: bash
        run: |
          set -u

          urlencode() {

            local string="${1}"
            local strlen=${#string}
            local encoded=""
            local pos
            local c
            local o

            for ((pos=0; pos<strlen; pos++)); do

              c="${string:$pos:1}"

              case "$c" in

                [-_.~a-zA-Z0-9])
                  o="$c"
                  ;;

                *)
                  printf -v o '%%%02X' "'$c"
                  ;;

              esac

              encoded+="${o}"

            done

            printf '%s' "$encoded"
          }

          if [ ! -s github-repositories.unique ]; then

            echo "No candidate files found."
            exit 0

          fi

          TOTAL=$(wc -l < github-repositories.unique)
          COUNT=0

          echo "Candidate files: $TOTAL"

          while IFS=$'\t' read -r REPO PATH BRANCH; do

            [ -z "$REPO" ] && continue
            [ -z "$PATH" ] && continue

            COUNT=$((COUNT + 1))

            echo ""
            echo "[$COUNT/$TOTAL]"
            echo "Repository: $REPO"
            echo "File:       $PATH"

            ENCODED_PATH=$(urlencode "$PATH")

            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${ENCODED_PATH}"

            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              "$RAW_URL" \
              >> github-node-source.tmp \
              || true

            echo "" >> github-node-source.tmp

            # 避免大量连续请求
            sleep 1

          done < github-repositories.unique

          echo ""
          echo "Downloaded bytes:"
          wc -c github-node-source.tmp

      # ==========================================================
      # 6. 提取 JP IPv4
      # ==========================================================
      - name: Extract Japan IPv4 nodes
        shell: bash
        run: |
          set -u

          : > jp-japan-lines.tmp
          : > jp-candidates.tmp
          : > jp-nodes.txt

          if [ ! -s github-node-source.tmp ]; then

            echo "No source data."
            exit 0

          fi

          # --------------------------------------------------------
          # 查找明确 JP 标识
          # --------------------------------------------------------
          grep -Ei \
            '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}.*(#JP|#Japan|🇯🇵|日本)' \
            github-node-source.tmp \
            > jp-japan-lines.tmp \
            || true

          # --------------------------------------------------------
          # 提取 IPv4:PORT
          # --------------------------------------------------------
          if [ -s jp-japan-lines.tmp ]; then

            grep -oE \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}' \
              jp-japan-lines.tmp \
              > jp-candidates.tmp \
              || true

          fi

          # --------------------------------------------------------
          # 验证
          # --------------------------------------------------------
          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            IP="${NODE%:*}"
            PORT="${NODE##*:}"

            [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || continue

            [[ "$PORT" =~ ^[0-9]+$ ]] \
              || continue

            IFS='.' read -r A B C D <<< "$IP"

            if [ "$A" -gt 255 ] ||
               [ "$B" -gt 255 ] ||
               [ "$C" -gt 255 ] ||
               [ "$D" -gt 255 ]; then

              continue

            fi

            if [ "$PORT" -lt 1 ] ||
               [ "$PORT" -gt 65535 ]; then

              continue

            fi

            echo "${IP}:${PORT}#JP"

          done < jp-candidates.tmp |
          sort -u \
            > jp-nodes.txt

          echo ""
          echo "=========================================="
          echo "Japan candidates"
          echo "=========================================="

          wc -l jp-nodes.txt

      # ==========================================================
      # 7. TCP + HTTPS 测速
      # ==========================================================
      - name: Test Japan nodes
        shell: bash
        run: |
          set -u

          INPUT="jp-nodes.txt"
          RESULTS="jp-speed-results.txt"

          : > "$RESULTS"

          if [ ! -s "$INPUT" ]; then

            echo "No Japan nodes."
            exit 0

          fi

          TOTAL=$(wc -l < "$INPUT")
          COUNT=0

          echo "=========================================="
          echo "Testing Japan nodes"
          echo "Total: $TOTAL"
          echo "=========================================="

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            COUNT=$((COUNT + 1))

            HOST="${NODE%%:*}"

            PORT="${NODE#*:}"
            PORT="${PORT%%#*}"

            echo ""
            echo "[$COUNT/$TOTAL] ${HOST}:${PORT}"

            # ------------------------------------------------------
            # TCP
            # ------------------------------------------------------
            TCP_START=$(date +%s%3N)

            if timeout 4 \
              bash -c ":</dev/tcp/$HOST/$PORT" \
              >/dev/null 2>&1; then

              TCP_END=$(date +%s%3N)

              TCP_MS=$((TCP_END - TCP_START))

              echo "TCP: ${TCP_MS} ms"

            else

              echo "TCP FAILED"

              continue

            fi

            # ------------------------------------------------------
            # HTTPS
            # ------------------------------------------------------
            CURL_OUTPUT=$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}' \
                --connect-timeout 4 \
                --max-time 7 \
                --resolve "www.cloudflare.com:443:${HOST}" \
                "https://www.cloudflare.com/cdn-cgi/trace" \
                2>/dev/null
            ) || true

            if [ -z "$CURL_OUTPUT" ]; then

              echo "HTTPS FAILED"

              continue

            fi

            HTTP_CODE=$(echo "$CURL_OUTPUT" | awk '{print $1}')
            TIME_CONNECT=$(echo "$CURL_OUTPUT" | awk '{print $2}')
            TIME_TTFB=$(echo "$CURL_OUTPUT" | awk '{print $3}')
            TIME_TOTAL=$(echo "$CURL_OUTPUT" | awk '{print $4}')

            # ------------------------------------------------------
            # 只接受 2xx / 3xx
            # ------------------------------------------------------
            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then

              CONNECT_MS=$(awk \
                -v t="$TIME_CONNECT" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TTFB_MS=$(awk \
                -v t="$TIME_TTFB" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TOTAL_MS=$(awk \
                -v t="$TIME_TOTAL" \
                'BEGIN { printf "%.0f", t * 1000 }')

              echo "HTTP:    $HTTP_CODE"
              echo "Connect: ${CONNECT_MS} ms"
              echo "TTFB:    ${TTFB_MS} ms"
              echo "Total:   ${TOTAL_MS} ms"

              printf '%s %s %s %s\n' \
                "$TOTAL_MS" \
                "$TCP_MS" \
                "$TTFB_MS" \
                "$NODE" \
                >> "$RESULTS"

            else

              echo "HTTP CODE: $HTTP_CODE"

            fi

          done < "$INPUT"

          echo ""
          echo "=========================================="
          echo "Working nodes"
          echo "=========================================="

          wc -l "$RESULTS"

      # ==========================================================
      # 8. Top 25
      # ==========================================================
      - name: Select Top 25 Japan nodes
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="github-jp-nodes.txt"

          # --------------------------------------------------------
          # 本轮无可用节点
          # 保留旧 TXT
          # --------------------------------------------------------
          if [ ! -s jp-speed-results.txt ]; then

            echo "No working Japan nodes."
            echo "Keeping previous output."

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 排序
          #
          # 1. HTTPS 总耗时
          # 2. TCP
          # 3. TTFB
          # --------------------------------------------------------
          sort -n \
            -k1,1 \
            -k2,2 \
            -k3,3 \
            jp-speed-results.txt |
          head -n 25 |
          awk '{print $4}' \
            > github-jp-nodes.new

          if [ ! -s github-jp-nodes.new ]; then

            echo "Top 25 result is empty."

            rm -f github-jp-nodes.new

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 原子替换
          # --------------------------------------------------------
          mv github-jp-nodes.new "$OUTPUT"

          echo "true" > .jp-update

          echo ""
          echo "=========================================="
          echo "TOP 25 JAPAN CF NODES"
          echo "=========================================="

          cat "$OUTPUT"

          echo ""
          echo "Selected:"
          wc -l < "$OUTPUT"

      # ==========================================================
      # 9. Commit
      # ==========================================================
      - name: Commit updated TXT
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # 本轮没有生成新结果
          # --------------------------------------------------------
          if [ ! -f .jp-update ]; then

            echo "No update status."
            exit 0

          fi

          if [ "$(cat .jp-update)" != "true" ]; then

            echo "No new result."
            echo "Nothing to commit."

            exit 0

          fi

          # --------------------------------------------------------
          # 文件存在
          # --------------------------------------------------------
          if [ ! -f github-jp-nodes.txt ]; then

            echo "github-jp-nodes.txt does not exist."

            exit 0

          fi

          # --------------------------------------------------------
          # 文件非空
          # --------------------------------------------------------
          if [ ! -s github-jp-nodes.txt ]; then

            echo "github-jp-nodes.txt is empty."

            exit 0

          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- github-jp-nodes.txt

          # --------------------------------------------------------
          # 没有变化
          # --------------------------------------------------------
          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          git commit \
            -m "Update Japan CF top 25 nodes"

          git push

      # ==========================================================
      # 10. 最终报告
      # ==========================================================
      - name: Show final report
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "FINAL JAPAN CF REPORT"
          echo "=========================================="

          if [ -s jp-speed-results.txt ]; then

            echo ""
            echo "HTTPS(ms) TCP(ms) TTFB(ms) NODE"
            echo "------------------------------------------"

            sort -n \
              -k1,1 \
              -k2,2 \
              -k3,3 \
              jp-speed-results.txt |
            head -n 25

          else

            echo "No working nodes."

          fi

          echo ""
          echo "=========================================="
          echo "github-jp-nodes.txt"
          echo "=========================================="

          if [ -s github-jp-nodes.txt ]; then

            cat github-jp-nodes.txt

          else

            echo "No new TXT generated."
            echo "Previous TXT, if any, was preserved."

          fi
