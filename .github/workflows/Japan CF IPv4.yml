name: Update Japan CF IPv4 Nodes

on:
  schedule:
    - cron: '17 */3 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jp-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter Japan nodes
        shell: bash
        run: |
          set -e

          SOURCE_URL="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ipv4.txt"
          OUTPUT_FILE="best-cf-ipv4-jp.txt"

          echo "Downloading source file..."
          curl -fL --retry 3 --connect-timeout 10 "$SOURCE_URL" -o source.txt

          echo "Filtering Japan (JP) nodes..."

          # 筛选日本节点
          # 原始：
          # 1.2.3.4:443#JP 🇯🇵
          #
          # 输出：
          # 1.2.3.4:443#JP
          grep '#JP ' source.txt \
            | sed 's/ 🇯🇵.*$//' \
            > "$OUTPUT_FILE"

          echo ""
          echo "Japan nodes:"
          cat "$OUTPUT_FILE"

          echo ""
          echo "Total Japan nodes: $(wc -l < "$OUTPUT_FILE")"

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add best-cf-ipv4-jp.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Japan CF IPv4 nodes"
          git push
