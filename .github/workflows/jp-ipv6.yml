name: JP IPv6 443 Node Scanner

on:
  schedule:
    # 每 6 小时运行一次
    - cron: "0 */6 * * *"

  # 支持 Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Scan JP IPv6 443 Nodes
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. 检查 IPv6
      # ============================================================
      - name: Check IPv6 connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking IPv6 connectivity"
          echo "========================================"

          if curl -6 \
            -sS \
            --connect-timeout 5 \
            --max-time 10 \
            -o /dev/null \
            "https://www.youtube.com/generate_204"
          then
            echo "IPv6 connectivity: OK"
          else
            echo "::warning::IPv6 connectivity is unavailable on this runner."
          fi


      # ============================================================
      # 3. 下载最新 CloudflareSpeedTest
      #
      # 官方 latest 下载地址
      # ============================================================
      - name: Download latest CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail

          rm -rf tools
          mkdir -p tools

          echo "Downloading latest CloudflareSpeedTest..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/cfst.tar.gz \
            "https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz"

          echo
          echo "Archive contents:"
          tar -tzvf /tmp/cfst.tar.gz

          echo
          echo "Extracting..."

          tar -xzf /tmp/cfst.tar.gz -C tools

          echo
          echo "Extracted files:"
          find tools -maxdepth 5 -type f -print


          # ----------------------------------------------------------
          # 自动寻找 cfst
          # ----------------------------------------------------------

          CFST=""

          if [ -f "tools/cfst" ]; then
            CFST="tools/cfst"

          elif [ -f "tools/cfst_linux_amd64" ]; then
            mv \
              "tools/cfst_linux_amd64" \
              "tools/cfst"

            CFST="tools/cfst"

          else
            FOUND=$(find tools -type f -name "cfst" -print -quit || true)

            if [ -n "$FOUND" ]; then
              mv "$FOUND" "tools/cfst"
              CFST="tools/cfst"
            fi
          fi


          # ----------------------------------------------------------
          # 如果仍然找不到，输出完整诊断
          # ----------------------------------------------------------

          if [ -z "$CFST" ] || [ ! -f "$CFST" ]; then

            echo "::error::CloudflareSpeedTest binary not found."

            echo
            echo "========================================"
            echo "tools directory"
            echo "========================================"

            find tools -maxdepth 10 -ls || true

            echo
            echo "========================================"
            echo "tar archive"
            echo "========================================"

            tar -tzvf /tmp/cfst.tar.gz || true

            exit 1
          fi


          chmod +x "$CFST"

          echo
          echo "========================================"
          echo "CloudflareSpeedTest"
          echo "========================================"

          "$CFST" -v

          echo
          echo "Help:"
          "$CFST" -h | head -80


      # ============================================================
      # 4. 扫描 IPv6
      #
      # IPv6:
      #
      # 2606:4700:5a::/48
      # 2606:4700:57::/48
      #
      # 日本 Cloudflare Colo:
      #
      # NRT = Tokyo
      # KIX = Osaka
      #
      # TCP 443
      # HTTPing
      # YouTube generate_204
      # 最大延迟 100ms
      # ============================================================
      - name: Scan Japan IPv6 nodes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work output

          echo "========================================"
          echo "Scanning IPv6"
          echo "========================================"

          echo "2606:4700:5a::/48"
          echo "2606:4700:57::/48"

          echo
          echo "Target:"
          echo "https://www.youtube.com/generate_204"

          echo
          echo "Japan Colo:"
          echo "NRT,KIX"

          echo
          echo "Port:"
          echo "443"

          echo
          echo "Latency limit:"
          echo "100 ms"


          ./tools/cfst \
            -ip "2606:4700:5a::/48,2606:4700:57::/48" \
            -tp 443 \
            -httping \
            -url "https://www.youtube.com/generate_204" \
            -httping-code 204 \
            -cfcolo "NRT,KIX" \
            -tl 100 \
            -tlr 0 \
            -n 200 \
            -t 4 \
            -dd \
            -p 1000 \
            -o "work/result.csv"


          echo
          echo "========================================"
          echo "Scan finished"
          echo "========================================"


          if [ ! -f "work/result.csv" ]; then
            echo "::error::result.csv was not generated."
            exit 1
          fi


          echo
          echo "Result:"
          cat work/result.csv


      # ============================================================
      # 5. 处理结果
      #
      # 条件：
      #
      # - IPv6
      # - 指定两个 /48
      # - 延迟 <=100ms
      # - 丢包率 = 0
      # - 最多保留 1000
      # - 按延迟最低排序
      # - 最终 25
      # ============================================================
      - name: Select top 25 nodes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import ipaddress
          import os
          import re


          INPUT = "work/result.csv"
          OUTPUT = "output"

          os.makedirs(OUTPUT, exist_ok=True)


          NETWORKS = [
              ipaddress.ip_network(
                  "2606:4700:5a::/48"
              ),
              ipaddress.ip_network(
                  "2606:4700:57::/48"
              ),
          ]


          def find_value(row, names):

              for name in names:

                  if name in row:
                      value = row[name]

                      if value is not None:
                          return value.strip()

              return None


          candidates = []


          with open(
              INPUT,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              print(
                  "CSV columns:",
                  reader.fieldnames
              )


              for row in reader:

                  ip_value = find_value(
                      row,
                      [
                          "IP 地址",
                          "IP",
                          "IP Address",
                      ]
                  )


                  latency_value = find_value(
                      row,
                      [
                          "平均延迟",
                          "Average Latency",
                          "Latency",
                      ]
                  )


                  loss_value = find_value(
                      row,
                      [
                          "丢包率",
                          "Packet Loss",
                          "Loss",
                      ]
                  )


                  if not ip_value:
                      continue


                  # ------------------------------------------------
                  # IPv6
                  # ------------------------------------------------

                  try:

                      ip_obj = ipaddress.ip_address(
                          ip_value
                      )

                  except ValueError:

                      continue


                  if ip_obj.version != 6:
                      continue


                  # ------------------------------------------------
                  # 必须属于两个指定 /48
                  # ------------------------------------------------

                  if not any(
                      ip_obj in network
                      for network in NETWORKS
                  ):
                      continue


                  # ------------------------------------------------
                  # 延迟
                  # ------------------------------------------------

                  if not latency_value:
                      continue


                  match = re.search(
                      r"\d+(?:\.\d+)?",
                      latency_value
                  )

                  if not match:
                      continue


                  latency = float(
                      match.group()
                  )


                  if latency > 100:
                      continue


                  # ------------------------------------------------
                  # 丢包
                  # ------------------------------------------------

                  if loss_value:

                      loss_match = re.search(
                          r"\d+(?:\.\d+)?",
                          loss_value
                      )

                      if loss_match:

                          loss = float(
                              loss_match.group()
                          )

                          if loss > 0:
                              continue


                  candidates.append(
                      (
                          latency,
                          str(ip_obj)
                      )
                  )


          # --------------------------------------------------------
          # 去重
          # --------------------------------------------------------

          candidates = list(
              set(candidates)
          )


          # --------------------------------------------------------
          # 延迟从低到高
          # --------------------------------------------------------

          candidates.sort(
              key=lambda x: x[0]
          )


          # --------------------------------------------------------
          # 最多 1000 个候选
          # --------------------------------------------------------

          candidates = candidates[:1000]


          print()
          print(
              "Candidates <=100ms:",
              len(candidates)
          )


          # --------------------------------------------------------
          # 最低延迟 25 个
          # --------------------------------------------------------

          top25 = candidates[:25]


          # --------------------------------------------------------
          # 删除旧 ping
          # --------------------------------------------------------

          for filename in os.listdir(OUTPUT):

              if filename.endswith(".ping"):

                  os.remove(
                      os.path.join(
                          OUTPUT,
                          filename
                      )
                  )


          # --------------------------------------------------------
          # JP01.ping ~ JP25.ping
          #
          # 文件内部：
          #
          # [IPv6]:443
          #
          # 没有 JP01
          # 没有延迟
          # 没有其他信息
          # --------------------------------------------------------

          for index, (latency, ip) in enumerate(
              top25,
              start=1
          ):

              filename = os.path.join(
                  OUTPUT,
                  f"JP{index:02d}.ping"
              )


              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      f"[{ip}]:443\n"
                  )


          # --------------------------------------------------------
          # 总节点列表
          #
          # 同样只输出 [IPv6]:443
          # --------------------------------------------------------

          with open(
              os.path.join(
                  OUTPUT,
                  "jp_ipv6_results.txt"
              ),
              "w",
              encoding="utf-8"
          ) as f:

              for latency, ip in top25:

                  f.write(
                      f"[{ip}]:443\n"
                  )


          print()
          print(
              "Final nodes:",
              len(top25)
          )


          if len(top25) < 25:

              print(
                  "::warning::"
                  f"Only {len(top25)} nodes "
                  "passed all filters."
              )


          print()
          print("Final list:")

          for latency, ip in top25:

              print(
                  f"[{ip}]:443"
              )

          PY


      # ============================================================
      # 6. 检查最终输出
      # ============================================================
      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final output"
          echo "========================================"

          cat output/jp_ipv6_results.txt


          COUNT=$(grep -cE '^\[[0-9a-fA-F:]+\]:443$' \
            output/jp_ipv6_results.txt || true)


          echo
          echo "Valid nodes: $COUNT"


          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No valid IPv6 nodes found."
            exit 1
          fi


          if [ "$COUNT" -gt 25 ]; then
            echo "::error::More than 25 nodes generated."
            exit 1
          fi


      # ============================================================
      # 7. 上传 Artifact
      # ============================================================
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: jp-ipv6-443-nodes
          path: output/
          retention-days: 7


      # ============================================================
      # 8. 写入仓库
      # ============================================================
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/jp-ipv6


          cp output/*.ping \
            .github/jp-ipv6/ \
            2>/dev/null || true


          cp output/jp_ipv6_results.txt \
            .github/jp-ipv6/ \
            2>/dev/null || true


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add .github/jp-ipv6/


          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Update JP IPv6 443 nodes"

            git push

          fi
```
