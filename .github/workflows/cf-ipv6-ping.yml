name: 🌐 Cloudflare IPv6 优选节点生成 (JP)

on:
  schedule:
    - cron: '0 3 * * *'      # 每天北京时间11点运行（UTC+8）
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  generate-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎲 生成 IPv6 地址池（两个 /48 段，每段随机3000个地址）
        run: |
          python3 << 'EOF'
          import random, ipaddress

          prefixes = ["2606:4700:5a::/48", "2606:4700:57::/48"]
          count_per_prefix = 3000  # 每段生成的随机地址数

          with open("ip.txt", "w") as f:
              for p in prefixes:
                  net = ipaddress.IPv6Network(p)
                  # 取网络前缀的整数表示，随机生成后64位
                  base = int(net.network_address)
                  for _ in range(count_per_prefix):
                      rand_suffix = random.getrandbits(64)
                      addr = ipaddress.IPv6Address(base + rand_suffix)
                      f.write(str(addr) + "\n")
          print("ip.txt 已生成")
          EOF

      - name: ⬇️ 下载 CloudflareSpeedTest
        run: |
          wget -q https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz
          tar -xzf CloudflareST_linux_amd64.tar.gz
          chmod +x CloudflareST

      - name: 🚀 开始测速（按延迟排序，取前25个IP，端口443）
        run: |
          ./CloudflareST \
            -f ip.txt \
            -url https://speed.cloudflare.com/__down?bytes=100000000 \
            -n 25 \
            -tl 0 \
            -sl 0 \
            -dn 0 \
            -t 4 \
            -tp 443 \
            -sort latency
          # 参数解释：
          # -n 25     : 最终输出前25个最快的IP
          # -tl 0     : 不限制延迟上限
          # -sl 0     : 不限制下载速度下限
          # -dn 0     : 不限制下载速度上限
          # -t 4      : 测速线程数
          # -tp 443   : 指定测速端口为443
          # -sort latency : 严格按延迟（Ping）排序

      - name: 📝 生成 Clash 节点 YAML (JP 01 ~ JP 25)
        run: |
          # 如果你的代理协议不同，请修改下面模板中的 type/uuid/path/host 等参数
          echo "proxies:" > proxies.yaml
          index=1
          # 跳过 CSV 第一行表头，取 IP 列（默认第一列）
          tail -n +2 result.csv | head -n 25 | while IFS=, read -r ip rest; do
              name=$(printf "JP %02d" $index)   # JP 01, JP 02 ...
              cat >> proxies.yaml << END
            - name: "${name}"
              type: vmess
              server: "${ip}"
              port: 443
              uuid: YOUR_UUID_HERE
              alterId: 0
              cipher: auto
              network: ws
              ws-opts:
                path: /your-path
                headers:
                  Host: your-sni-domain.com
              tls: true
              servername: your-sni-domain.com
          END
              index=$((index + 1))
          done
          echo "✅ 已生成 proxies.yaml（共 $(($index-1)) 条节点）"

      - name: 📤 提交结果到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 更新优选节点 [skip ci]"
          file_pattern: "proxies.yaml result.csv ip.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
