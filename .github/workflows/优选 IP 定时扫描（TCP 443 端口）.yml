name: 优选 IPv4（443端口，带端口输出）

on:
  schedule:
    - cron: '0 */3 * * *'       # 每3小时执行
  workflow_dispatch:            # 支持手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: TCP 443 端口延迟测试（取前20，输出带 :443）
        run: |
          # 生成 IP 列表
          for i in {1..254}; do
            echo "172.64.229.$i"
          done > ip_list.txt

          # 精准测试函数（测量 TCP 连接时间，单位秒）
          test_ip() {
            ip=$1
            time=$(curl -o /dev/null -s -w "%{time_connect}" --connect-timeout 3 -k "https://${ip}:443" 2>/dev/null)
            if [ -n "$time" ] && [ "$time" != "0.000" ] && [ "$time" != "0" ]; then
              echo "$ip $time"
            fi
          }
          export -f test_ip

          # 并发 50 进程扫描
          cat ip_list.txt | xargs -P 50 -I {} bash -c 'test_ip "$@"' _ {} > raw_result.txt

          # 若无可用 IP，输出提示
          if [ ! -s raw_result.txt ]; then
            echo "未找到任何可用的 443 端口 IP" > best_ips.txt
            echo "未找到任何可用的 443 端口 IP" > best_ips_iponly.txt
            exit 0
          fi

          # 排序取前 20
          sort -k2 -n raw_result.txt | head -20 > sorted.txt

          # 生成带延迟的结果（IP:443 + 延迟 ms）
          awk '{printf "%-18s %.2f ms\n", $1 ":443", $2*1000}' sorted.txt > best_ips.txt

          # 生成仅 IP:443 列表（不带延迟）
          awk '{print $1 ":443"}' sorted.txt > best_ips_iponly.txt

          # 打印统计
          total=$(wc -l < raw_result.txt)
          echo "✅ 可用的 IP 总数：$total"
          echo "📋 前 20 个最优 IP："
          cat best_ips.txt

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips.txt best_ips_iponly.txt
          git diff --staged --quiet || git commit -m "自动更新优选IP（443端口，$(date +'%Y-%m-%d %H:%M:%S')）"
          git push
