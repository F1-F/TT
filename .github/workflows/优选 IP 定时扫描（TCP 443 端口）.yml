name: 优选 IPv4（443端口，带编号标签）

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5    # ← v4 改为 v5

      - name: TCP 443 端口延迟测试（取前20，带 #JP v4 标签）
        run: |
          for i in {1..254}; do
            echo "172.64.229.$i"
          done > ip_list.txt

          test_ip() {
            ip=$1
            time=$(curl -o /dev/null -s -w "%{time_connect}" --connect-timeout 3 -k "https://${ip}:443" 2>/dev/null)
            if [ -n "$time" ] && [ "$time" != "0.000" ] && [ "$time" != "0" ]; then
              echo "$ip $time"
            fi
          }
          export -f test_ip

          cat ip_list.txt | xargs -P 50 -I {} bash -c 'test_ip "$@"' _ {} > raw_result.txt

          if [ ! -s raw_result.txt ]; then
            echo "未找到任何可用的 443 端口 IP" > best_ips.txt
            echo "未找到任何可用的 443 端口 IP" > best_ips_iponly.txt
            exit 0
          fi

          sort -k2 -n raw_result.txt | head -20 > sorted.txt

          # 修改点：将 "#JP-IPv4" 改为 "#JP v4"
          awk '{printf "%-18s %.2f ms  #JP v4 %02d\n", $1 ":443", $2*1000, NR}' sorted.txt > best_ips.txt
          awk '{printf "%s#JP v4 %02d\n", $1 ":443", NR}' sorted.txt > best_ips_iponly.txt

          total=$(wc -l < raw_result.txt)
          echo "✅ 可用的 IP 总数：$total"
          echo "📋 前 20 个最优 IP（带编号）："
          cat best_ips_iponly.txt

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips.txt best_ips_iponly.txt
          git diff --staged --quiet || git commit -m "自动更新优选IP（443端口，带编号标签 $(date +'%Y-%m-%d %H:%M:%S')）"
          git push
