name: GitHub Japan CF Nodes Top 25

on:
  # 每 3 小时运行一次
  # 使用 17 分钟避免整点高峰
  schedule:
    - cron: '17 */3 * * *'

  # 支持 GitHub Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-japan-nodes:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 获取当前仓库
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 搜索 GitHub 最近 12 小时更新的公开代码
      # ============================================================
      - name: Search recent GitHub nodes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RAW_DATA="github-node-source.tmp"
          REPOS="github-repositories.tmp"

          rm -f "$RAW_DATA" "$REPOS"
          touch "$RAW_DATA" "$REPOS"

          # --------------------------------------------------------
          # 当前 UTC 时间
          # --------------------------------------------------------
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # --------------------------------------------------------
          # 12 小时以前
          # --------------------------------------------------------
          SINCE=$(date -u -d '12 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          echo "=========================================="
          echo "GitHub Japan CF Node Collector"
          echo "=========================================="
          echo "Current UTC : $NOW"
          echo "Search since: $SINCE"
          echo ""

          # --------------------------------------------------------
          # 搜索关键词
          # --------------------------------------------------------
          QUERIES=(
            '"#JP"'
            '"#Japan"'
            '"🇯🇵"'
            '"JP 🇯🇵"'
            '"443#JP"'
            '"2053#JP"'
            '"8443#JP"'
            '"2083#JP"'
            '"2087#JP"'
            '"2096#JP"'
            '"Japan"'
            '"日本"'
            '"Cloudflare"'
            '"CF"'
          )

          # --------------------------------------------------------
          # GitHub Code Search
          # --------------------------------------------------------
          for QUERY in "${QUERIES[@]}"; do

            echo ""
            echo "------------------------------------------"
            echo "Searching: $QUERY"
            echo "------------------------------------------"

            ENCODED_QUERY=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

            SEARCH_QUERY="${ENCODED_QUERY}+pushed:%3E%3D${SINCE}"

            # 每个关键词最多搜索 3 页
            for PAGE in 1 2 3; do

              RESPONSE=$(curl -fsSL \
                --retry 3 \
                --connect-timeout 15 \
                --max-time 60 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/search/code?q=${SEARCH_QUERY}&per_page=100&page=${PAGE}" \
                || true)

              if [ -z "$RESPONSE" ]; then
                echo "Empty API response."
                break
              fi

              # ------------------------------------------------------
              # GitHub API 错误
              # ------------------------------------------------------
              if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then
                echo "GitHub API:"
                echo "$RESPONSE" | jq -r '.message'
                break
              fi

              # ------------------------------------------------------
              # 保存：
              #
              # repository
              # path
              # default branch
              # ------------------------------------------------------
              echo "$RESPONSE" |
                jq -r '
                  .items[]?
                  | select(.repository.private == false)
                  | [
                      .repository.full_name,
                      .path,
                      (.repository.default_branch // "main")
                    ]
                  | @tsv
                ' >> "$REPOS"

              COUNT=$(echo "$RESPONSE" | jq '.items | length')

              echo "Page $PAGE: $COUNT results"

              # 不满 100 条，说明没有下一页
              if [ "$COUNT" -lt 100 ]; then
                break
              fi

              sleep 3

            done

            # 避免 Code Search 请求过快
            sleep 5

          done

          # --------------------------------------------------------
          # 候选文件去重
          # --------------------------------------------------------
          sort -u "$REPOS" > "${REPOS}.unique"

          echo ""
          echo "=========================================="
          echo "Unique candidate files"
          echo "=========================================="

          wc -l "${REPOS}.unique"

          # ========================================================
          # 3. 下载候选文件
          # ========================================================

          while IFS=$'\t' read -r REPO PATH BRANCH; do

            [ -z "$REPO" ] && continue
            [ -z "$PATH" ] && continue

            ENCODED_PATH=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('''$PATH'''))")

            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${ENCODED_PATH}"

            echo "Downloading:"
            echo "  Repository: $REPO"
            echo "  File      : $PATH"

            curl -fsSL \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 30 \
              "$RAW_URL" \
              >> "$RAW_DATA" \
              || true

            echo "" >> "$RAW_DATA"

            sleep 0.5

          done < "${REPOS}.unique"

      # ============================================================
      # 4. 提取日本 IPv4 节点
      # ============================================================
      - name: Extract Japan IPv4 nodes
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES="jp-candidates.tmp"

          rm -f "$CANDIDATES"
          touch "$CANDIDATES"

          if [ -s github-node-source.tmp ]; then

            # ------------------------------------------------------
            # 找到包含：
            #
            # #JP
            # #Japan
            # 🇯🇵
            # 日本
            #
            # 的节点行
            # ------------------------------------------------------
            grep -Ei \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}.*(#JP|#Japan|🇯🇵|日本)' \
              github-node-source.tmp |
            grep -oE \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}' \
              > "$CANDIDATES" \
              || true

          fi

          # --------------------------------------------------------
          # 验证 IP / Port
          # --------------------------------------------------------

          > jp-nodes.txt

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            IP="${NODE%:*}"
            PORT="${NODE##*:}"

            # IPv4 格式
            [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            # Port 格式
            [[ "$PORT" =~ ^[0-9]+$ ]] || continue

            IFS='.' read -r A B C D <<< "$IP"

            # IP 每段必须 0-255
            if [ "$A" -le 255 ] &&
               [ "$B" -le 255 ] &&
               [ "$C" -le 255 ] &&
               [ "$D" -le 255 ] &&
               [ "$PORT" -ge 1 ] &&
               [ "$PORT" -le 65535 ]; then

              echo "${IP}:${PORT}#JP" >> jp-nodes.txt

            fi

          done < "$CANDIDATES"

          # 去重
          sort -u jp-nodes.txt -o jp-nodes.txt

          echo ""
          echo "=========================================="
          echo "Unique Japan nodes"
          echo "=========================================="

          wc -l jp-nodes.txt

      # ============================================================
      # 5. TCP + HTTPS 实际测试
      # ============================================================
      - name: Test Japan nodes
        shell: bash
        run: |
          set -u

          INPUT="jp-nodes.txt"
          RESULTS="jp-speed-results.txt"

          rm -f "$RESULTS"
          touch "$RESULTS"

          TOTAL=$(wc -l < "$INPUT")

          echo "=========================================="
          echo "Testing $TOTAL Japan nodes"
          echo "=========================================="

          COUNT=0

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            COUNT=$((COUNT + 1))

            HOST="${NODE%%:*}"

            PORT="${NODE#*:}"
            PORT="${PORT%%#*}"

            echo ""
            echo "[$COUNT/$TOTAL] $HOST:$PORT"

            # ------------------------------------------------------
            # TCP 连接测试
            # ------------------------------------------------------

            TCP_START=$(date +%s%3N)

            if timeout 4 bash -c \
              ":</dev/tcp/$HOST/$PORT" \
              >/dev/null 2>&1; then

              TCP_END=$(date +%s%3N)

              TCP_MS=$((TCP_END - TCP_START))

              echo "TCP: ${TCP_MS} ms"

            else

              echo "TCP: FAILED"

              continue

            fi

            # ------------------------------------------------------
            # HTTPS 测试
            #
            # 强制 Cloudflare 域名解析到当前 IP
            # ------------------------------------------------------

            CURL_OUTPUT=$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}' \
                --connect-timeout 4 \
                --max-time 7 \
                --resolve "www.cloudflare.com:443:${HOST}" \
                "https://www.cloudflare.com/cdn-cgi/trace" \
                2>/dev/null
            ) || true

            if [ -z "$CURL_OUTPUT" ]; then

              echo "HTTPS: FAILED"

              continue

            fi

            HTTP_CODE=$(echo "$CURL_OUTPUT" | awk '{print $1}')
            TIME_CONNECT=$(echo "$CURL_OUTPUT" | awk '{print $2}')
            TIME_TTFB=$(echo "$CURL_OUTPUT" | awk '{print $3}')
            TIME_TOTAL=$(echo "$CURL_OUTPUT" | awk '{print $4}')

            # ------------------------------------------------------
            # 只接受 2xx / 3xx
            # ------------------------------------------------------

            if [[ "$HTTP_CODE" =~ ^(2|3)[0-9][0-9]$ ]]; then

              CONNECT_MS=$(awk \
                -v t="$TIME_CONNECT" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TTFB_MS=$(awk \
                -v t="$TIME_TTFB" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TOTAL_MS=$(awk \
                -v t="$TIME_TOTAL" \
                'BEGIN { printf "%.0f", t * 1000 }')

              echo "HTTP    : $HTTP_CODE"
              echo "Connect : ${CONNECT_MS} ms"
              echo "TTFB    : ${TTFB_MS} ms"
              echo "Total   : ${TOTAL_MS} ms"

              # ----------------------------------------------------
              # 保存：
              #
              # HTTPS总耗时
              # TCP耗时
              # TTFB
              # IP:PORT#JP
              # ----------------------------------------------------

              echo "$TOTAL_MS $TCP_MS $TTFB_MS $NODE" \
                >> "$RESULTS"

            else

              echo "HTTPS HTTP CODE: $HTTP_CODE"

            fi

          done < "$INPUT"

          echo ""
          echo "=========================================="
          echo "Working Japan nodes"
          echo "=========================================="

          wc -l "$RESULTS"

      # ============================================================
      # 6. 按速度排序并取最快 25 个
      # ============================================================
      - name: Select top 25 Japan nodes
        shell: bash
        run: |
          set -e

          OUTPUT="github-jp-nodes.txt"

          # 如果本次完全没有可用节点
          # 保留上一轮结果，不覆盖
          if [ ! -s jp-speed-results.txt ]; then

            echo "No working Japan nodes found."
            echo "Keeping previous github-jp-nodes.txt"

            exit 0

          fi

          echo "=========================================="
          echo "Top 25 Japan nodes"
          echo "=========================================="

          # --------------------------------------------------------
          # 排序规则：
          #
          # 第一优先级：HTTPS 总耗时
          # 第二优先级：TCP 延迟
          # 第三优先级：TTFB
          # --------------------------------------------------------

          sort -n \
            -k1,1 \
            -k2,2 \
            -k3,3 \
            jp-speed-results.txt |
          head -n 25 |
          awk '{print $4}' \
            > "$OUTPUT"

          echo ""
          cat "$OUTPUT"

          echo ""
          echo "Selected nodes:"
          wc -l < "$OUTPUT"

      # ============================================================
      # 7. 提交 TXT
      # ============================================================
      - name: Commit updated TXT
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-jp-nodes.txt

          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          git commit \
            -m "Update Japan CF top 25 nodes"

          git push

      # ============================================================
      # 8. 显示测速结果
      # ============================================================
      - name: Show speed report
        if: always()
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "Japan CF Speed Report"
          echo "=========================================="

          if [ -f jp-speed-results.txt ]; then

            echo ""
            echo "HTTPS(ms) TCP(ms) TTFB(ms) NODE"
            echo "------------------------------------------"

            sort -n \
              -k1,1 \
              -k2,2 \
              -k3,3 \
              jp-speed-results.txt |
            head -n 25

          else

            echo "No speed results."

          fi
