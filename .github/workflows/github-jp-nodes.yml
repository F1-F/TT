name: GitHub Japan CF Nodes Top 25

on:
  # 每 3 小时运行一次
  # GitHub 默认使用 UTC
  schedule:
    - cron: '17 */3 * * *'

  # 支持手动运行
  workflow_dispatch:

# 防止多个 Workflow 同时运行造成 git 冲突
concurrency:
  group: github-jp-nodes
  cancel-in-progress: true

# 允许 GITHUB_TOKEN 写入当前仓库
permissions:
  contents: write

jobs:
  collect-japan-nodes:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. 初始化
      # ==========================================================
      - name: Initialize
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            github-node-source.tmp \
            github-repositories.tmp \
            github-repositories.unique \
            jp-candidates.tmp \
            jp-nodes.txt \
            jp-speed-results.txt \
            github-jp-nodes.new \
            .jp-update

          touch github-node-source.tmp
          touch github-repositories.tmp

          echo "=========================================="
          echo "GitHub Japan CF Node Collector"
          echo "=========================================="
          echo "UTC time:"
          date -u

          echo ""
          echo "Search window:"
          date -u -d '12 hours ago'
          echo "to"
          date -u

      # ==========================================================
      # 3. 搜索 GitHub
      # ==========================================================
      #
      # 注意：
      # GitHub Code Search 并不能可靠地用 pushed: qualifier
      # 完成“最近 12 小时文件”的精确搜索。
      #
      # 因此这里采用：
      #
      # Code Search
      #      ↓
      # 获取候选仓库
      #      ↓
      # 检查仓库最近更新时间
      #
      # 避免把不存在/不稳定的 pushed: 查询直接作为唯一依据。
      # ==========================================================
      - name: Search GitHub candidate files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          QUERIES=(
            '"#JP"'
            '"#Japan"'
            '"🇯🇵"'
            '"JP 🇯🇵"'
            '"443#JP"'
            '"2053#JP"'
            '"8443#JP"'
            '"2083#JP"'
            '"2087#JP"'
            '"2096#JP"'
            '"Japan"'
            '"日本"'
            '"Cloudflare"'
            '"CF"'
          )

          for QUERY in "${QUERIES[@]}"; do

            echo ""
            echo "=========================================="
            echo "Searching: $QUERY"
            echo "=========================================="

            ENCODED_QUERY=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

            for PAGE in 1 2; do

              RESPONSE=$(curl -fsSL \
                --retry 3 \
                --connect-timeout 15 \
                --max-time 60 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/search/code?q=${ENCODED_QUERY}&per_page=100&page=${PAGE}" \
                || true)

              if [ -z "$RESPONSE" ]; then
                echo "Empty response."
                break
              fi

              # API 错误
              if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then
                echo "GitHub API:"
                echo "$RESPONSE" | jq -r '.message'
                break
              fi

              COUNT=$(echo "$RESPONSE" | jq '.items | length')

              echo "Page $PAGE: $COUNT results"

              # ----------------------------------------------------
              # 保存：
              #
              # repository
              # path
              # branch
              # ----------------------------------------------------
              echo "$RESPONSE" |
                jq -r '
                  .items[]?
                  | select(.repository.private == false)
                  | [
                      .repository.full_name,
                      .path,
                      (.repository.default_branch // "main")
                    ]
                  | @tsv
                ' >> github-repositories.tmp

              if [ "$COUNT" -lt 100 ]; then
                break
              fi

              sleep 3

            done

            # 防止 Code Search 请求过快
            sleep 4

          done

          # --------------------------------------------------------
          # 去重
          # --------------------------------------------------------
          sort -u \
            github-repositories.tmp \
            > github-repositories.unique

          echo ""
          echo "=========================================="
          echo "Candidate files"
          echo "=========================================="

          wc -l github-repositories.unique

      # ==========================================================
      # 4. 下载候选文件
      # ==========================================================
      - name: Download candidate files
        shell: bash
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r REPO PATH BRANCH; do

            [ -z "$REPO" ] && continue
            [ -z "$PATH" ] && continue

            ENCODED_PATH=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('''$PATH'''))")

            RAW_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${ENCODED_PATH}"

            echo "Downloading:"
            echo "  Repository: $REPO"
            echo "  File:       $PATH"

            curl -fsSL \
              --retry 2 \
              --connect-timeout 10 \
              --max-time 30 \
              "$RAW_URL" \
              >> github-node-source.tmp \
              || true

            echo "" >> github-node-source.tmp

            sleep 0.4

          done < github-repositories.unique

          echo ""
          echo "Downloaded source size:"
          wc -c github-node-source.tmp

      # ==========================================================
      # 5. 提取 JP IPv4
      # ==========================================================
      - name: Extract Japan IPv4 nodes
        shell: bash
        run: |
          set -euo pipefail

          : > jp-candidates.tmp

          if [ ! -s github-node-source.tmp ]; then
            echo "No downloaded source data."
            exit 0
          fi

          # --------------------------------------------------------
          # 只处理明确带有日本标识的行
          #
          # 支持：
          #
          # #JP
          # #Japan
          # 🇯🇵
          # 日本
          # --------------------------------------------------------
          grep -Ei \
            '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}.*(#JP|#Japan|🇯🇵|日本)' \
            github-node-source.tmp \
            > jp-japan-lines.tmp \
            || true

          if [ -s jp-japan-lines.tmp ]; then

            grep -oE \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}' \
              jp-japan-lines.tmp \
              > jp-candidates.tmp \
              || true

          fi

          # --------------------------------------------------------
          # 验证 IP / Port
          # --------------------------------------------------------
          : > jp-nodes.txt

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            IP="${NODE%:*}"
            PORT="${NODE##*:}"

            # IP 格式
            [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || continue

            # Port 格式
            [[ "$PORT" =~ ^[0-9]+$ ]] \
              || continue

            IFS='.' read -r A B C D <<< "$IP"

            # IP 范围
            if [ "$A" -gt 255 ] ||
               [ "$B" -gt 255 ] ||
               [ "$C" -gt 255 ] ||
               [ "$D" -gt 255 ]; then
              continue
            fi

            # Port 范围
            if [ "$PORT" -lt 1 ] ||
               [ "$PORT" -gt 65535 ]; then
              continue
            fi

            echo "${IP}:${PORT}#JP" >> jp-nodes.txt

          done < jp-candidates.tmp

          # --------------------------------------------------------
          # 去重
          # --------------------------------------------------------
          sort -u jp-nodes.txt -o jp-nodes.txt

          echo ""
          echo "=========================================="
          echo "Unique Japan nodes"
          echo "=========================================="

          wc -l jp-nodes.txt

      # ==========================================================
      # 6. TCP + HTTPS 测试
      # ==========================================================
      - name: Test Japan nodes
        shell: bash
        run: |
          set -u

          INPUT="jp-nodes.txt"
          RESULTS="jp-speed-results.txt"

          : > "$RESULTS"

          if [ ! -s "$INPUT" ]; then
            echo "No Japan nodes to test."
            exit 0
          fi

          TOTAL=$(wc -l < "$INPUT")
          COUNT=0

          echo "=========================================="
          echo "Testing Japan nodes"
          echo "Total: $TOTAL"
          echo "=========================================="

          while IFS= read -r NODE; do

            [ -z "$NODE" ] && continue

            COUNT=$((COUNT + 1))

            HOST="${NODE%%:*}"

            PORT="${NODE#*:}"
            PORT="${PORT%%#*}"

            echo ""
            echo "[$COUNT/$TOTAL] ${HOST}:${PORT}"

            # ------------------------------------------------------
            # TCP 测试
            # ------------------------------------------------------

            TCP_START=$(date +%s%3N)

            if timeout 4 \
              bash -c ":</dev/tcp/$HOST/$PORT" \
              >/dev/null 2>&1; then

              TCP_END=$(date +%s%3N)
              TCP_MS=$((TCP_END - TCP_START))

              echo "TCP: ${TCP_MS} ms"

            else

              echo "TCP: FAILED"
              continue

            fi

            # ------------------------------------------------------
            # HTTPS / TLS 测试
            #
            # 使用 Cloudflare HTTPS endpoint
            # 强制把 www.cloudflare.com 指向当前 IP
            # ------------------------------------------------------

            CURL_OUTPUT=$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code} %{time_connect} %{time_starttransfer} %{time_total}' \
                --connect-timeout 4 \
                --max-time 7 \
                --resolve "www.cloudflare.com:443:${HOST}" \
                "https://www.cloudflare.com/cdn-cgi/trace" \
                2>/dev/null
            ) || true

            if [ -z "$CURL_OUTPUT" ]; then

              echo "HTTPS: FAILED"
              continue

            fi

            HTTP_CODE=$(echo "$CURL_OUTPUT" | awk '{print $1}')
            TIME_CONNECT=$(echo "$CURL_OUTPUT" | awk '{print $2}')
            TIME_TTFB=$(echo "$CURL_OUTPUT" | awk '{print $3}')
            TIME_TOTAL=$(echo "$CURL_OUTPUT" | awk '{print $4}')

            # ------------------------------------------------------
            # 只接受 HTTP 2xx / 3xx
            # ------------------------------------------------------

            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then

              CONNECT_MS=$(awk \
                -v t="$TIME_CONNECT" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TTFB_MS=$(awk \
                -v t="$TIME_TTFB" \
                'BEGIN { printf "%.0f", t * 1000 }')

              TOTAL_MS=$(awk \
                -v t="$TIME_TOTAL" \
                'BEGIN { printf "%.0f", t * 1000 }')

              echo "HTTP:    $HTTP_CODE"
              echo "Connect: ${CONNECT_MS} ms"
              echo "TTFB:    ${TTFB_MS} ms"
              echo "Total:   ${TOTAL_MS} ms"

              # ----------------------------------------------------
              # 保存：
              #
              # HTTPS总耗时
              # TCP耗时
              # TTFB
              # IP:PORT#JP
              # ----------------------------------------------------

              printf '%s %s %s %s\n' \
                "$TOTAL_MS" \
                "$TCP_MS" \
                "$TTFB_MS" \
                "$NODE" \
                >> "$RESULTS"

            else

              echo "HTTPS HTTP CODE: $HTTP_CODE"
              continue

            fi

          done < "$INPUT"

          echo ""
          echo "=========================================="
          echo "Working nodes"
          echo "=========================================="

          wc -l "$RESULTS"

      # ==========================================================
      # 7. 选择 Top 25
      # ==========================================================
      - name: Select Top 25 Japan nodes
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="github-jp-nodes.txt"

          # --------------------------------------------------------
          # 本轮没有任何可用节点
          #
          # 不创建新文件
          # 不覆盖旧文件
          # 不产生 Git 提交
          # --------------------------------------------------------
          if [ ! -s jp-speed-results.txt ]; then

            echo "=========================================="
            echo "No working Japan nodes"
            echo "=========================================="

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 按：
          #
          # 1. HTTPS 总耗时
          # 2. TCP
          # 3. TTFB
          #
          # 排序
          # --------------------------------------------------------

          sort -n \
            -k1,1 \
            -k2,2 \
            -k3,3 \
            jp-speed-results.txt |
          head -n 25 |
          awk '{print $4}' \
            > github-jp-nodes.new

          # --------------------------------------------------------
          # 再次确认输出不为空
          # --------------------------------------------------------

          if [ ! -s github-jp-nodes.new ]; then

            echo "Generated Top 25 file is empty."

            rm -f github-jp-nodes.new

            echo "false" > .jp-update

            exit 0

          fi

          # --------------------------------------------------------
          # 原子替换
          # --------------------------------------------------------

          mv github-jp-nodes.new "$OUTPUT"

          echo "true" > .jp-update

          echo ""
          echo "=========================================="
          echo "TOP 25 JAPAN NODES"
          echo "=========================================="

          cat "$OUTPUT"

          echo ""
          echo "Total selected:"
          wc -l < "$OUTPUT"

      # ==========================================================
      # 8. 提交 TXT
      # ==========================================================
      - name: Commit updated TXT
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # 本轮没有新结果
          # --------------------------------------------------------

          if [ ! -f .jp-update ]; then

            echo "No update status file."
            echo "Skipping commit."

            exit 0

          fi

          if [ "$(cat .jp-update)" != "true" ]; then

            echo "No new result."
            echo "Keeping previous github-jp-nodes.txt."

            exit 0

          fi

          # --------------------------------------------------------
          # 最终文件存在性检查
          # --------------------------------------------------------

          if [ ! -f github-jp-nodes.txt ]; then

            echo "ERROR: github-jp-nodes.txt does not exist."

            exit 0

          fi

          if [ ! -s github-jp-nodes.txt ]; then

            echo "ERROR: github-jp-nodes.txt is empty."

            exit 0

          fi

          # --------------------------------------------------------
          # Git 配置
          # --------------------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------------
          # 添加文件
          # --------------------------------------------------------

          git add -- github-jp-nodes.txt

          # --------------------------------------------------------
          # 没有变化则不提交
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          # --------------------------------------------------------
          # 提交
          # --------------------------------------------------------

          git commit \
            -m "Update Japan CF top 25 nodes"

          # --------------------------------------------------------
          # 推送
          # --------------------------------------------------------

          git push

      # ==========================================================
      # 9. 显示最终测速报告
      # ==========================================================
      - name: Show final speed report
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Japan CF Speed Report"
          echo "=========================================="

          if [ -s jp-speed-results.txt ]; then

            echo ""
            echo "HTTPS(ms) TCP(ms) TTFB(ms) NODE"
            echo "------------------------------------------"

            sort -n \
              -k1,1 \
              -k2,2 \
              -k3,3 \
              jp-speed-results.txt |
            head -n 25

          else

            echo "No working nodes."

          fi

          echo ""
          echo "=========================================="
          echo "Final TXT"
          echo "=========================================="

          if [ -s github-jp-nodes.txt ]; then

            cat github-jp-nodes.txt

          else

            echo "No new TXT generated in this run."

          fi
